# Sürüm etiketi (ör. v1.0.1) gönderildiğinde kurulum dosyasını ve tek .exe'yi derleyip
# GitHub Releases sayfasına ekler. Elle çalıştırıldığında (workflow_dispatch) sadece derler
# ve dosyaları "Artifacts" olarak bırakır.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sürüm etiketi ile __version__ aynı mı?
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $line = Select-String -Path mcbshot/__init__.py -Pattern '^__version__'
          $version = ($line.Line -split '"')[1]
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Etiket ${{ github.ref_name }} ama mcbshot/__init__.py içindeki sürüm $version"
            exit 1
          }

      - name: Paketleri kur
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Derle (.exe + kurulum dosyası)
        shell: cmd
        run: setup_olustur.bat /nopause

      - name: Paket sınaması (--selftest)
        # Sunucuda ekran/OCR dili kısıtlı olabilir: sonuç bilgi amaçlı, derlemeyi durdurmaz
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Process dist\MCBShot.exe -ArgumentList "--selftest" -Wait
          Get-Content "$env:TEMP\mcbshot_selftest.txt" -Encoding utf8

      - name: Derlenen dosyaları sakla
        uses: actions/upload-artifact@v4
        with:
          name: MCBShot
          path: |
            installer/Output/*.exe
            dist/MCBShot.exe

      - name: Sürüm sayfasına ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            dist/MCBShot.exe
          generate_release_notes: true
